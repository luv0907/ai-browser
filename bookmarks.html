<!DOCTYPE html>
<html>
  <head>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 16px; }
      h1 { font-size: 18px; margin-top: 0; }
      table { width: 100%; border-collapse: collapse; }
      td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: top; }
      a { color: #1a73e8; text-decoration: none; word-break: break-all; }
      .del { color: #c33; cursor: pointer; padding: 0 6px; }
      #empty { color: #777; padding: 20px 0; }
    </style>
  </head>
  <body>
    <h1>⭐ Bookmarks</h1>
    <div id="empty" style="display:none">No bookmarks yet. Click the ☆ next to the address bar to save a page.</div>
    <table>
      <thead><tr><th>Title</th><th>Address</th><th>Saved</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>

    <script>
      let items = [];

      function render() {
        const rows = document.getElementById("rows");
        const empty = document.getElementById("empty");
        rows.innerHTML = "";
        empty.style.display = items.length ? "none" : "block";
        items.forEach((it) => {
          const tr = document.createElement("tr");
          const when = new Date(it.time).toLocaleString();
          const tdTitle = document.createElement("td");
          tdTitle.textContent = it.title || "(no title)";
          const tdUrl = document.createElement("td");
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = it.url;
          a.onclick = (e) => { e.preventDefault(); window.browserData.openNewBrowserWindow(it.url); };
          tdUrl.appendChild(a);
          const tdWhen = document.createElement("td");
          tdWhen.textContent = when;
          const tdDel = document.createElement("td");
          const del = document.createElement("span");
          del.className = "del";
          del.textContent = "✕";
          del.onclick = () => window.browserData.bookmarksRemove(it.url);
          tdDel.appendChild(del);
          tr.append(tdTitle, tdUrl, tdWhen, tdDel);
          rows.appendChild(tr);
        });
      }

      async function load() {
        items = await window.browserData.bookmarksList();
        render();
      }

      window.browserData.onUpdate("bookmarks:updated", (data) => { items = data; render(); });

      load();
    </script>
  </body>
</html>
