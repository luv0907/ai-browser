<!DOCTYPE html>
<html>
  <head>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 16px; }
      h1 { font-size: 18px; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
      h1 button { font-size: 13px; padding: 6px 10px; cursor: pointer; }
      .item { border-bottom: 1px solid #eee; padding: 10px 0; }
      .name { font-weight: bold; font-size: 14px; word-break: break-all; }
      .meta { font-size: 12px; color: #777; margin-top: 2px; }
      .bar { height: 6px; background: #eee; border-radius: 4px; margin-top: 6px; overflow: hidden; }
      .fill { height: 100%; background: #1a73e8; }
      .actions { margin-top: 6px; }
      .actions button { font-size: 12px; padding: 4px 10px; margin-right: 6px; cursor: pointer; }
      #empty { color: #777; padding: 20px 0; }
    </style>
  </head>
  <body>
    <h1>⬇️ Downloads <button id="clear">Clear list</button></h1>
    <div id="empty" style="display:none">No downloads yet.</div>
    <div id="list"></div>

    <script>
      function fmtBytes(n) {
        if (!n) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        let i = 0;
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
        return n.toFixed(1) + " " + units[i];
      }

      function render(items) {
        const list = document.getElementById("list");
        const empty = document.getElementById("empty");
        list.innerHTML = "";
        empty.style.display = items.length ? "none" : "block";
        items.forEach((it) => {
          const pct = it.totalBytes ? Math.round((it.receivedBytes / it.totalBytes) * 100) : 0;
          const div = document.createElement("div");
          div.className = "item";

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = it.filename;

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent =
            new Date(it.time).toLocaleString() + " — " +
            (it.state === "completed" ? "Done (" + fmtBytes(it.totalBytes) + ")" :
             it.state === "cancelled" ? "Cancelled" :
             it.state === "interrupted" ? "Failed" :
             fmtBytes(it.receivedBytes) + " of " + fmtBytes(it.totalBytes) + " (" + pct + "%)");

          div.append(name, meta);

          if (it.state === "progressing" || it.state === "paused") {
            const bar = document.createElement("div");
            bar.className = "bar";
            const fill = document.createElement("div");
            fill.className = "fill";
            fill.style.width = pct + "%";
            bar.appendChild(fill);
            div.appendChild(bar);
          }

          if (it.state === "completed" && it.path) {
            const actions = document.createElement("div");
            actions.className = "actions";
            const openBtn = document.createElement("button");
            openBtn.textContent = "Open file";
            openBtn.onclick = () => window.browserData.downloadsOpenFile(it.path);
            const folderBtn = document.createElement("button");
            folderBtn.textContent = "Show in folder";
            folderBtn.onclick = () => window.browserData.downloadsOpenFolder(it.path);
            actions.append(openBtn, folderBtn);
            div.appendChild(actions);
          }

          list.appendChild(div);
        });
      }

      async function load() {
        render(await window.browserData.downloadsList());
      }

      document.getElementById("clear").onclick = () => window.browserData.downloadsClear();
      window.browserData.onUpdate("downloads:updated", render);

      load();
    </script>
  </body>
</html>
