<!DOCTYPE html>
<html>
  <head>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 20px; max-width: 480px; }
      h1 { font-size: 18px; margin-top: 0; }
      label { display: block; font-size: 13px; font-weight: bold; margin: 16px 0 6px; }
      label.inline { display: flex; align-items: center; gap: 8px; font-weight: normal; }
      input[type="text"], input:not([type]), select { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; }
      button { padding: 10px 14px; font-size: 14px; cursor: pointer; margin-top: 16px; }
      #saved { color: #2a8; font-size: 13px; margin-left: 10px; }
      hr { margin: 28px 0; border: none; border-top: 1px solid #eee; }
      #danger { color: #c33; }
      p.note { font-size: 12px; color: #777; }
      #searchLink { background: none; border: none; color: #1a73e8; text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>⚙️ Settings</h1>

    <label class="inline"><input type="checkbox" id="useHome" /> Use my own search home page for new tabs</label>
    <p class="note">When this is off, new tabs open a fixed address instead — like a classic browser homepage.</p>

    <div id="homepageRow">
      <label for="homepage">Homepage address</label>
      <input id="homepage" placeholder="https://www.wikipedia.org" />
    </div>

    <label for="engine">Search engine (used when your own index has no results)</label>
    <select id="engine">
      <option value="https://www.google.com/search?q=">Google</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
    </select>

    <p class="note"><button id="searchLink">🔎 Manage your search engine's index →</button></p>

    <button id="save">Save settings</button>
    <span id="saved" style="display:none">✓ Saved</span>

    <hr />

    <h1 id="danger">Clear browsing data</h1>
    <p class="note">Deletes your history and bookmarks on this Mac, and clears cookies/site data for this profile. This cannot be undone.</p>
    <button id="clearData">Clear history, bookmarks and site data</button>

    <script>
      function syncHomepageRow() {
        document.getElementById("homepageRow").style.display =
          document.getElementById("useHome").checked ? "none" : "block";
      }

      async function load() {
        const s = await window.browserData.settingsGet();
        const useHome = s.homepage === "app:home";
        document.getElementById("useHome").checked = useHome;
        document.getElementById("homepage").value = useHome ? "" : s.homepage;
        document.getElementById("engine").value = s.searchEngine;
        syncHomepageRow();
      }

      document.getElementById("useHome").onchange = syncHomepageRow;

      document.getElementById("save").onclick = async () => {
        const useHome = document.getElementById("useHome").checked;
        let homepage;
        if (useHome) {
          homepage = "app:home";
        } else {
          homepage = document.getElementById("homepage").value.trim() || "https://www.wikipedia.org";
          if (!homepage.startsWith("http")) homepage = "https://" + homepage;
        }
        const searchEngine = document.getElementById("engine").value;
        await window.browserData.settingsSet({ homepage, searchEngine });
        const saved = document.getElementById("saved");
        saved.style.display = "inline";
        setTimeout(() => (saved.style.display = "none"), 1500);
      };

      document.getElementById("searchLink").onclick = () => window.browserData.openWindow("search");

      document.getElementById("clearData").onclick = async () => {
        if (confirm("This deletes history, bookmarks and site data for this profile. Continue?")) {
          await window.browserData.settingsClearData();
          alert("Cleared.");
        }
      };

      load();
    </script>
  </body>
</html>
