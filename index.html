<!DOCTYPE html>
<html>
  <head>
    <style>
      body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }

      /* tabs */
      #tabs { display: flex; gap: 4px; padding: 6px 8px 0; background: #d8d8d8; align-items: flex-end; overflow-x: auto; }
      .tab { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #c4c4c4; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; max-width: 180px; white-space: nowrap; }
      .tab.active { background: #eee; font-weight: bold; }
      .tab .title { overflow: hidden; text-overflow: ellipsis; }
      .tab .close { color: #555; }
      #newtab { padding: 2px 10px; font-size: 16px; cursor: pointer; margin-bottom: 2px; }

      /* address bar */
      #bar { display: flex; gap: 6px; padding: 8px; background: #eee; position: relative; }
      #url { flex: 1; padding: 6px; font-size: 14px; }
      #star { font-size: 18px; width: 36px; }
      #shield { font-size: 13px; }
      #profileBadge { font-size: 13px; }
      #menuBtn { width: 36px; }

      /* menu dropdown */
      #menu { display: none; position: absolute; right: 8px; top: 42px; background: white; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 10; min-width: 200px; }
      #menu.show { display: block; }
      #menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; border: none; background: none; cursor: pointer; font-size: 14px; }
      #menu button:hover { background: #f0f0f0; }

      /* warning bar */
      #warn { display: none; padding: 8px 12px; background: #ffe3e3; border-bottom: 2px solid #d33; font-size: 14px; }
      #warn.show { display: block; }
      #warnText { white-space: pre-wrap; margin-bottom: 8px; }

      /* page area + sidebar */
      #main { display: flex; flex: 1; min-height: 0; }
      #views { flex: 1; position: relative; }
      webview { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; }
      webview.active { visibility: visible; }

      /* home / new-tab search page, shown instead of a webview */
      #homeOverlay {
        position: absolute; inset: 0; display: none; flex-direction: column;
        align-items: center; justify-content: center; background: white; gap: 18px;
      }
      #homeOverlay.active { display: flex; }
      #homeLogo { font-size: 30px; font-weight: bold; color: #333; }
      #homeSearch { width: 60%; max-width: 560px; padding: 14px 18px; font-size: 16px; border: 1px solid #ccc; border-radius: 24px; outline: none; }
      #homeSearch:focus { border-color: #1a73e8; box-shadow: 0 1px 6px rgba(26,115,232,0.3); }
      #homeHint { font-size: 13px; color: #777; }
      #homeHint a { color: #1a73e8; text-decoration: none; }

      #side { width: 320px; padding: 12px; background: #f7f7f7; border-left: 1px solid #ccc; overflow-y: auto; }
      #side button { width: 100%; padding: 10px; font-size: 15px; margin-bottom: 8px; }
      #out { white-space: pre-wrap; margin-top: 12px; font-size: 14px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="tabs">
      <button id="newtab">+</button>
    </div>

    <div id="bar">
      <button id="back">←</button>
      <button id="forward">→</button>
      <button id="reload">⟳</button>
      <input id="url" placeholder="Type a website or search..." />
      <button id="star" title="Bookmark this page">☆</button>
      <button id="go">Go</button>
      <button id="shield" title="Ads/trackers blocked on this page">🛡️ 0</button>
      <button id="profileBadge" title="Switch profile"></button>
      <button id="menuBtn">☰</button>
      <div id="menu">
        <button id="menuHistory">🕘 History (⌘Y)</button>
        <button id="menuBookmarks">⭐ Bookmarks</button>
        <button id="menuDownloads">⬇️ Downloads (⌘⇧J)</button>
        <button id="menuSearch">🔎 My Search Engine</button>
        <button id="menuSettings">⚙️ Settings (⌘,)</button>
        <button id="menuNewWindow">🪟 New Window (⌘⇧N)</button>
        <button id="menuSwitch">👤 Switch Profile</button>
      </div>
    </div>

    <div id="warn">
      <div id="warnText"></div>
      <button id="warnContinue">Continue anyway</button>
      <button id="warnClose">Dismiss</button>
    </div>

    <div id="main">
      <div id="views">
        <div id="homeOverlay">
          <div id="homeLogo">🔎 AI Browser</div>
          <input id="homeSearch" placeholder="Search your index or the web..." />
          <div id="homeHint">Add sites to <a href="#" id="homeSearchLink">My Search Engine</a> so results come from your own ranked index.</div>
        </div>
      </div>
      <div id="side">
        <button id="summarize">✨ Summarize page</button>
        <button id="check">🛡️ Check safety</button>
        <div id="out">Open a page, then click a button.</div>
      </div>
    </div>

    <script>
      const url = document.getElementById("url");
      const out = document.getElementById("out");
      const tabsBar = document.getElementById("tabs");
      const newTabBtn = document.getElementById("newtab");
      const viewsBox = document.getElementById("views");
      const warn = document.getElementById("warn");
      const warnText = document.getElementById("warnText");
      const warnContinue = document.getElementById("warnContinue");
      const starBtn = document.getElementById("star");
      const shieldBtn = document.getElementById("shield");
      const menuBtn = document.getElementById("menuBtn");
      const menu = document.getElementById("menu");
      const profileBadge = document.getElementById("profileBadge");
      const homeOverlay = document.getElementById("homeOverlay");
      const homeSearch = document.getElementById("homeSearch");

      let tabs = [];
      let current = null;
      let pendingUrl = null;
      let bookmarksCache = [];
      let myProfileId = null;
      let settingsCache = { homepage: "app:home", searchEngine: "https://www.google.com/search?q=", blockAds: true, autoIndex: true };

      // ---------- Safety rules ----------
      const SHORTENERS = ["bit.ly", "tinyurl.com", "t.co", "cutt.ly", "rb.gy", "is.gd"];
      const WORDS = ["login", "verify", "update", "kyc", "otp", "secure", "reward", "gift", "free", "claim"];
      const BRANDS = {
        sbi: ["sbi.co.in", "onlinesbi.sbi"],
        hdfc: ["hdfcbank.com"],
        icici: ["icicibank.com"],
        paytm: ["paytm.com"],
        phonepe: ["phonepe.com"],
        google: ["google.com", "google.co.in"],
        amazon: ["amazon.in", "amazon.com"],
        flipkart: ["flipkart.com"],
      };

      function checkUrl(urlText) {
        let u;
        try { u = new URL(urlText); } catch { return { score: 0, reasons: ["Not a valid web address"] }; }

        const host = u.hostname.toLowerCase();
        const reasons = [];
        let score = 0;
        function flag(points, text) { score += points; reasons.push(text); }

        if (u.protocol !== "https:") flag(2, "Not using HTTPS (connection is not encrypted)");
        if (/^\d+\.\d+\.\d+\.\d+$/.test(host)) flag(3, "Address is a raw number, not a name");
        if (host.includes("xn--")) flag(3, "Uses look-alike (punycode) characters");
        if (host.split(".").length > 4) flag(1, "Too many sub-domains");
        if ((host.match(/-/g) || []).length >= 3) flag(1, "Many hyphens in the name");
        if (SHORTENERS.includes(host)) flag(2, "Link shortener hides the real destination");

        for (const [brand, domains] of Object.entries(BRANDS)) {
          const isReal = domains.some((d) => host === d || host.endsWith("." + d));
          if (host.includes(brand) && !isReal) flag(3, `Name has "${brand}" but it is not the real ${brand} site`);
        }

        const hits = WORDS.filter((w) => host.includes(w) || u.pathname.toLowerCase().includes(w));
        if (hits.length) flag(1, "Pressure words: " + hits.join(", "));

        return { score, reasons };
      }

      // ---------- Warning bar ----------
      function showWarning(text, result, blocked) {
        pendingUrl = blocked ? text : null;
        warnText.textContent =
          (blocked ? "⚠️ Stopped before loading: " : "⚠️ This page looks risky: ") + text + "\n" +
          result.reasons.map((r) => "• " + r).join("\n");
        warnContinue.style.display = blocked ? "inline-block" : "none";
        warn.classList.add("show");
      }
      function hideWarning() {
        pendingUrl = null;
        warn.classList.remove("show");
      }
      warnContinue.onclick = () => {
        const target = pendingUrl;
        hideWarning();
        if (target) current.view.src = target;
      };
      document.getElementById("warnClose").onclick = hideWarning;

      // ---------- Bookmark star ----------
      function isBookmarked(u) {
        return bookmarksCache.some((b) => b.url === u);
      }
      function updateStar() {
        starBtn.textContent = current && !current.isHome && isBookmarked(current.lastUrl) ? "★" : "☆";
      }
      function updateShieldBadge() {
        shieldBtn.textContent = "🛡️ " + (current ? current.blockedCount || 0 : 0);
      }
      async function toggleBookmark() {
        if (!current || current.isHome) return;
        const u = current.lastUrl;
        if (isBookmarked(u)) {
          await window.browserData.bookmarksRemove(u);
        } else {
          const title = current.el.querySelector(".title").textContent || u;
          await window.browserData.bookmarksAdd({ url: u, title });
        }
      }
      starBtn.onclick = toggleBookmark;

      // ---------- Menu dropdown ----------
      menuBtn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle("show"); };
      document.addEventListener("click", () => menu.classList.remove("show"));
      document.getElementById("menuHistory").onclick = () => window.browserData.openWindow("history");
      document.getElementById("menuBookmarks").onclick = () => window.browserData.openWindow("bookmarks");
      document.getElementById("menuDownloads").onclick = () => window.browserData.openWindow("downloads");
      document.getElementById("menuSearch").onclick = () => window.browserData.openWindow("search");
      document.getElementById("menuSettings").onclick = () => window.browserData.openWindow("settings");
      document.getElementById("menuNewWindow").onclick = () => window.browserData.openNewBrowserWindow();
      document.getElementById("menuSwitch").onclick = () => window.profiles.switchProfile();
      profileBadge.onclick = () => window.profiles.switchProfile();

      // ---------- Tabs ----------
      function selectTab(tab) {
        current = tab;
        tabs.forEach((t) => {
          t.view.classList.toggle("active", t === tab && !t.isHome);
          t.el.classList.toggle("active", t === tab);
        });
        homeOverlay.classList.toggle("active", tab.isHome);
        url.value = tab.isHome ? "" : tab.lastUrl;
        hideWarning();
        updateStar();
        updateShieldBadge();
        if (tab.isHome) homeSearch.focus();
      }

      function closeTab(tab) {
        const i = tabs.indexOf(tab);
        tabs.splice(i, 1);
        tab.view.remove();
        tab.el.remove();
        if (tabs.length === 0) { newTab(); return; }
        if (tab === current) selectTab(tabs[Math.max(0, i - 1)]);
      }

      function toLoadable(text) {
        text = text.trim();
        if (!text) return null;
        const looksLikeUrl = text.startsWith("http") || (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(text) && !text.includes(" "));
        return looksLikeUrl ? (text.startsWith("http") ? text : "https://" + text) : null;
      }

      // Builds a simple results page from our own ranked index, with a fallback
      // link to the real web when our small index has nothing relevant.
      async function performSearch(tab, query) {
        tab.isHome = false;
        const results = await window.browserData.searchQuery(query);
        const fallbackUrl = settingsCache.searchEngine + encodeURIComponent(query);

        let html;
        if (results.length) {
          html =
            "<!DOCTYPE html><html><head><meta charset='utf-8'><style>" +
            "body{font-family:sans-serif;max-width:700px;margin:40px auto;padding:0 16px;color:#222;}" +
            "h2{font-size:14px;color:#666;font-weight:normal;}" +
            ".r{margin-bottom:22px;} .r a{font-size:18px;color:#1a0dab;text-decoration:none;} .r a:hover{text-decoration:underline;}" +
            ".u{color:#006621;font-size:13px;} .s{color:#444;font-size:14px;margin-top:4px;}" +
            "#fb{margin-top:30px;font-size:13px;color:#555;} #fb a{color:#1a73e8;}" +
            "</style></head><body>" +
            "<h2>🔎 Your Search — ranked results from your own index for \"" + query.replace(/</g, "&lt;") + "\"</h2>" +
            results
              .map(
                (r) =>
                  "<div class='r'><a href='" + r.url + "'>" + (r.title || r.url).replace(/</g, "&lt;") + "</a>" +
                  "<div class='u'>" + r.url + " &middot; score " + r.score + "</div>" +
                  "<div class='s'>" + r.snippet.replace(/</g, "&lt;") + "</div></div>"
              )
              .join("") +
            "<div id='fb'>Not finding it? <a href='" + fallbackUrl + "'>Search the web instead →</a></div>" +
            "</body></html>";
          tab.view.src = "data:text/html;charset=utf-8," + encodeURIComponent(html);
        } else {
          tab.view.src = fallbackUrl;
        }

        if (tab === current) {
          url.value = query;
          homeOverlay.classList.remove("active");
          tab.view.classList.add("active");
        }
      }

      function newTab(startUrl) {
        const view = document.createElement("webview");
        // Keeps this tab's cookies/storage inside THIS profile's own account
        // (and lets Shields block ads/trackers for this profile's session).
        view.setAttribute("partition", "persist:profile-" + myProfileId);

        const el = document.createElement("div");
        el.className = "tab";
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = "New tab";
        const close = document.createElement("span");
        close.className = "close";
        close.textContent = "×";
        el.append(title, close);

        const useHome = !startUrl && settingsCache.homepage === "app:home";
        const tab = { view, el, lastUrl: useHome ? "app:home" : (startUrl || settingsCache.homepage), isHome: useHome };

        el.onclick = () => selectTab(tab);
        close.onclick = (e) => { e.stopPropagation(); closeTab(tab); };

        view.addEventListener("page-title-updated", (e) => {
          title.textContent = e.title;
          if (tab === current) updateStar();
        });

        // Captures this webview's own content-process id so the shield counter
        // (incremented from main.js when a request is blocked) can be matched
        // back to the right tab.
        view.addEventListener("dom-ready", () => {
          tab.wcId = view.getWebContentsId();
        });

        view.addEventListener("did-navigate", (e) => {
          tab.lastUrl = e.url;
          tab.isHome = false;
          tab.blockedCount = 0; // a fresh page load starts a fresh shield count
          if (!e.url.startsWith("data:")) {
            window.browserData.historyAdd({ url: e.url, title: title.textContent });
          }
          if (tab !== current) return;
          url.value = e.url.startsWith("data:") ? url.value : e.url;
          homeOverlay.classList.remove("active");
          view.classList.add("active");
          updateStar();
          updateShieldBadge();
          if (!e.url.startsWith("data:")) {
            const result = checkUrl(e.url);
            if (result.score >= 4) showWarning(e.url, result, false);
            else if (!pendingUrl) hideWarning();
          }
        });

        // Auto-builds your own personal, local search index from pages you
        // actually visit (off entirely if "autoIndex" is turned off in Settings).
        view.addEventListener("did-stop-loading", async () => {
          if (settingsCache.autoIndex === false || tab.isHome) return;
          const pageUrl = tab.lastUrl;
          if (!pageUrl || !pageUrl.startsWith("http")) return;
          try {
            const text = await view.executeJavaScript("document.body.innerText");
            window.browserData.searchIndexPage({ url: pageUrl, title: title.textContent, text });
          } catch {
            // the page may block script injection; just skip indexing it
          }
        });

        if (!useHome) view.src = tab.lastUrl;
        viewsBox.appendChild(view);
        tabsBar.insertBefore(el, newTabBtn);
        tabs.push(tab);
        selectTab(tab);
      }

      newTabBtn.onclick = () => newTab();

      // ---------- Home page search box ----------
      homeSearch.onkeydown = (e) => {
        if (e.key === "Enter" && homeSearch.value.trim()) {
          const text = homeSearch.value.trim();
          const direct = toLoadable(text);
          if (direct) {
            current.isHome = false;
            current.view.src = direct;
          } else {
            performSearch(current, text);
          }
          homeSearch.value = "";
        }
      };
      document.getElementById("homeSearchLink").onclick = (e) => {
        e.preventDefault();
        window.browserData.openWindow("search");
      };

      // ---------- Address bar + buttons ----------
      function go() {
        const text = url.value.trim();
        if (!text) return;
        const direct = toLoadable(text);

        if (direct) {
          const result = checkUrl(direct);
          if (result.score >= 4) {
            showWarning(direct, result, true);
            return;
          }
          hideWarning();
          current.isHome = false;
          current.view.src = direct;
        } else {
          performSearch(current, text);
        }
      }

      document.getElementById("go").onclick = go;
      url.onkeydown = (e) => { if (e.key === "Enter") go(); };
      document.getElementById("back").onclick = () => current.view.goBack();
      document.getElementById("forward").onclick = () => current.view.goForward();
      document.getElementById("reload").onclick = () => current.view.reload();

      // ---------- Sidebar buttons ----------
      document.getElementById("summarize").onclick = async () => {
        if (!current || current.isHome) { out.textContent = "Open a page first."; return; }
        out.textContent = "Reading the page... ⏳";
        const pageText = await current.view.executeJavaScript("document.body.innerText");
        out.textContent = "Asking AI... ⏳";
        out.textContent = await window.ai.summarize(pageText);
      };

      document.getElementById("check").onclick = () => {
        let text = url.value.trim();
        if (!text) { out.textContent = "Type or open an address first."; return; }
        if (!text.startsWith("http")) text = "https://" + text;

        const { score, reasons } = checkUrl(text);
        const level = score >= 4 ? "🔴 HIGH RISK" : score >= 2 ? "🟠 MEDIUM RISK" : "🟢 LOW RISK";
        out.textContent =
          level + "  (score " + score + ")\n\n" +
          (reasons.length ? reasons.map((r) => "• " + r).join("\n") : "No warning signs found.") +
          "\n\nThis is a simple rule check, not a guarantee.";
      };

      // ---------- Keyboard shortcuts from the app menu ----------
      window.browserData.onShortcut("shortcut:new-tab", () => newTab());
      window.browserData.onShortcut("shortcut:close-tab", () => current && closeTab(current));
      window.browserData.onShortcut("shortcut:focus-url", () => { url.focus(); url.select(); });
      window.browserData.onShortcut("shortcut:reload", () => current && !current.isHome && current.view.reload());
      window.browserData.onShortcut("shortcut:bookmark", () => toggleBookmark());

      // ---------- Stay in sync with Bookmarks/Settings windows ----------
      window.browserData.onUpdate("bookmarks:updated", (data) => { bookmarksCache = data; updateStar(); });
      window.browserData.onUpdate("settings:updated", (data) => { settingsCache = data; });

      // ---------- Shields: counts ads/trackers blocked, per tab ----------
      window.browserData.onUpdate("adblock:blocked", (data) => {
        const tab = tabs.find((t) => t.wcId === data.webContentsId);
        if (!tab) return;
        tab.blockedCount = (tab.blockedCount || 0) + 1;
        if (tab === current) updateShieldBadge();
      });

      // ---------- Start up ----------
      (async function init() {
        settingsCache = await window.browserData.settingsGet();
        bookmarksCache = await window.browserData.bookmarksList();
        const me = await window.profiles.current();
        if (me) { profileBadge.textContent = me.emoji + " " + me.name; myProfileId = me.id; }

        const params = new URLSearchParams(location.search);
        const startUrl = params.get("start");
        newTab(startUrl);
      })();
    </script>
  </body>
</html>
